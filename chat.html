<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: #fff;
    }

    #header {
      padding: 12px 16px;
      background: #1a73e8;
      color: white;
      font-size: 15px;
      font-weight: 600;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg {
      max-width: 78%;
      padding: 9px 13px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.4;
      word-break: break-word;
    }

    .user {
      background: #1a73e8;
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .bot {
      background: #f1f3f4;
      color: #202124;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .typing {
      background: #f1f3f4;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
      padding: 10px 14px;
      border-radius: 16px;
    }

    .typing span {
      display: inline-block;
      width: 7px; height: 7px;
      background: #999;
      border-radius: 50%;
      margin: 0 2px;
      animation: bounce 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40%           { transform: translateY(-6px); }
    }

    #input-row {
      display: flex;
      gap: 8px;
      padding: 10px 12px;
      border-top: 1px solid #e0e0e0;
      background: #fff;
    }

    #input {
      flex: 1;
      padding: 9px 14px;
      border: 1px solid #dadce0;
      border-radius: 22px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    #input:focus { border-color: #1a73e8; }

    #send {
      padding: 9px 18px;
      background: #1a73e8;
      color: white;
      border: none;
      border-radius: 22px;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s;
    }

    #send:hover    { background: #1558b0; }
    #send:disabled { background: #aaa; cursor: default; }
  </style>
</head>
<body>

  <div id="header">How can we help you?</div>
  <div id="messages"></div>
  <div id="input-row">
    <input id="input" type="text" placeholder="Type a message..." autocomplete="off" />
    <button id="send">Send</button>
  </div>

  <script>
    // ── Config ────────────────────────────────────────────────────
    const WEBHOOK_URL = 'YOUR_N8N_WEBHOOK_URL';
    const JWT_TOKEN   = 'YOUR_JWT_TOKEN';
    // ─────────────────────────────────────────────────────────────

    const messagesEl = document.getElementById('messages');
    const inputEl    = document.getElementById('input');
    const sendBtn    = document.getElementById('send');

    // Persistent across visits; new session per tab
    function getIds() {
      let visitor_id = localStorage.getItem('chat_visitor_id');
      if (!visitor_id) {
        visitor_id = crypto.randomUUID();
        localStorage.setItem('chat_visitor_id', visitor_id);
      }
      let session_id = sessionStorage.getItem('chat_session_id');
      if (!session_id) {
        session_id = crypto.randomUUID();
        sessionStorage.setItem('chat_session_id', session_id);
      }
      return { visitor_id, session_id };
    }

    const ids = getIds();

    function addMessage(text, role) {
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    function showTyping() {
      const div = document.createElement('div');
      div.className = 'typing';
      div.id = 'typing-indicator';
      div.innerHTML = '<span></span><span></span><span></span>';
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function removeTyping() {
      const el = document.getElementById('typing-indicator');
      if (el) el.remove();
    }

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text) return;

      addMessage(text, 'user');
      inputEl.value = '';
      sendBtn.disabled = true;
      showTyping();

      try {
        const res = await fetch(WEBHOOK_URL, {
          method: 'POST',
          headers: {
            'Content-Type':  'application/json',
            'Authorization': `Bearer ${JWT_TOKEN}`
          },
          body: JSON.stringify({
            message:    text,
            visitor_id: ids.visitor_id,
            session_id: ids.session_id,
            timestamp:  Date.now()
          })
        });

        const data = await res.json();
        removeTyping();
        addMessage(data.reply ?? data.message ?? JSON.stringify(data), 'bot');
      } catch {
        removeTyping();
        addMessage('Sorry, something went wrong. Please try again.', 'bot');
      } finally {
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }

    sendBtn.addEventListener('click', sendMessage);
    inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });

    // Greeting on load
    addMessage('Hi! How can we help you today?', 'bot');
    inputEl.focus();
  </script>
</body>
</html>
